<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="description" content="Organize filmes, séries e livros que você quer ver, está consumindo ou já terminou." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Minha Estante</title>
  <style>
    :root{--bg:#f7f4ee;--surface:#fff;--text:#161616;--muted:#77736c;--border:#e7e0d6;--accent:#1b1b1b;--soft:#eee7dc;--danger:#a83f35;--radius:20px;--shadow:0 12px 30px rgba(0,0,0,.06)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{width:min(100%,760px);margin:0 auto;padding:22px 16px 100px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}h1{margin:0;font-size:clamp(28px,7vw,42px);letter-spacing:-1.5px}.subtitle{color:var(--muted);margin:6px 0 0;font-size:14px;line-height:1.4}.primary{border:0;background:var(--accent);color:#fff;padding:12px 15px;border-radius:14px;cursor:pointer;font-weight:700;min-width:max-content}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px}.stat strong{display:block;font-size:22px;margin-bottom:3px}.stat span{font-size:12px;color:var(--muted)}.toolbar{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 88%,rgba(247,244,238,0));padding:10px 0 14px}.search-wrap{position:relative}.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none}.search{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:15px;padding:14px 42px;outline:none}.search:focus{border-color:#9b948b;box-shadow:0 0 0 3px rgba(0,0,0,.04)}.search-count{font-size:12px;color:var(--muted);margin:7px 4px 0;display:none}.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 12px;border-radius:999px;white-space:nowrap;cursor:pointer;font-size:13px}.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}.list{display:grid;gap:12px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}.card-layout{display:grid;grid-template-columns:auto 1fr;gap:14px}.poster{width:82px;height:122px;border-radius:12px;object-fit:cover;background:var(--soft);border:1px solid var(--border)}.poster-wrap{width:82px}.card-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.title{margin:0;font-size:18px;font-weight:800;line-height:1.25}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.tag{background:var(--soft);padding:6px 9px;border-radius:999px;font-size:12px;color:#504a43}.tag-suggest{background:#fff3cd;color:#725a00}.rating{font-size:14px;margin-top:10px;letter-spacing:1px}.notes{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.45;white-space:pre-wrap}.suggest-source{margin:7px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;margin-top:14px}.ghost,.danger{border:1px solid var(--border);background:transparent;border-radius:12px;padding:9px 11px;cursor:pointer;font-size:13px}.danger{color:var(--danger)}.empty{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius)}.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:28px;box-shadow:0 12px 28px rgba(0,0,0,.2);cursor:pointer;display:none}dialog{width:min(92vw,520px);border:0;border-radius:24px;padding:0;box-shadow:0 22px 70px rgba(0,0,0,.24);max-height:88vh}dialog::backdrop{background:rgba(0,0,0,.45)}.modal{padding:20px;background:var(--surface);max-height:88vh;overflow-y:auto}.modal h2{margin:0 0 16px;font-size:24px;letter-spacing:-.7px}.grid{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;font-weight:700;display:grid;gap:6px}input,select,textarea{width:100%;border:1px solid var(--border);background:#fff;border-radius:13px;padding:12px 13px;outline:none;color:var(--text)}textarea{resize:vertical;min-height:90px}.check-row{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--border);background:#fbfaf8;border-radius:14px;padding:12px 13px;font-size:13px;font-weight:700;cursor:pointer}.check-row input{width:18px;height:18px;margin:1px 0 0;accent-color:#111}.help{font-size:11px;color:var(--muted);font-weight:400;line-height:1.4}.image-preview{display:none;align-items:center;gap:12px;padding:10px;border:1px solid var(--border);border-radius:14px;background:#fbfaf8}.image-preview img{width:58px;height:86px;object-fit:cover;border-radius:9px;border:1px solid var(--border)}.image-preview span{font-size:12px;color:var(--muted);line-height:1.4}.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}.secondary{border:1px solid var(--border);background:transparent;padding:11px 14px;border-radius:13px;cursor:pointer}.backup{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.backup button,.backup label{border:1px solid var(--border);background:var(--surface);padding:9px 12px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:600}.backup input{display:none}@media(max-width:580px){header .primary{display:none}.fab{display:block}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:19px}.row{grid-template-columns:1fr}.card-layout{grid-template-columns:auto 1fr}.poster{width:72px;height:108px}.poster-wrap{width:72px}}
  </style>
</head>
<body>
  <main class="app">
    <header><div><h1>Minha Estante</h1><p class="subtitle">Filmes, séries e livros. O que você quer conhecer, está acompanhando ou já terminou.</p></div><button class="primary" id="addBtn">+ Adicionar</button></header>
    <section class="stats"><div class="stat"><strong id="totalCount">0</strong><span>Total</span></div><div class="stat"><strong id="doneCount">0</strong><span>Concluídos</span></div><div class="stat"><strong id="wantCount">0</strong><span>Quero ver/ler</span></div></section>
    <section class="toolbar">
      <div class="search-wrap"><span class="search-icon">🔎</span><input id="search" class="search" placeholder="Buscar para saber se você já viu ou leu..." autocomplete="off" /></div>
      <div class="search-count" id="searchCount"></div>
      <div class="filters" id="typeFilters"><button class="chip active" data-type="Todos">Todos</button><button class="chip" data-type="Filme">🎬 Filmes</button><button class="chip" data-type="Série">📺 Séries</button><button class="chip" data-type="Livro">📚 Livros</button><button class="chip" id="suggestionFilter">💡 Sugestões</button></div>
      <div class="filters" id="statusFilters"><button class="chip active" data-status="Todos">Todos os status</button><button class="chip" data-status="Quero ver/ler">Quero ver/ler</button><button class="chip" data-status="Em andamento">Em andamento</button><button class="chip" data-status="Concluído">Concluído</button></div>
    </section>
    <section id="list" class="list"></section>
    <div class="backup"><button id="exportBtn">Exportar backup</button><label>Importar backup<input id="importInput" type="file" accept=".json,application/json" /></label><button id="restoreAutoBackupBtn">Restaurar backup automático</button></div>
  </main>
  <button class="fab" id="fab" aria-label="Adicionar item">+</button>

  <dialog id="dialog">
    <form method="dialog" class="modal" id="itemForm">
      <h2 id="modalTitle">Adicionar item</h2>
      <div class="grid">
        <label>Título<input id="titleInput" required placeholder="Ex.: Black Bird" /></label>
        <div class="row">
          <label>Tipo<select id="typeInput"><option>Filme</option><option>Série</option><option>Livro</option></select></label>
          <label>Status<select id="statusInput"><option>Quero ver/ler</option><option>Em andamento</option><option>Concluído</option></select></label>
        </div>

        <label class="check-row"><input id="suggestionInput" type="checkbox" /><span>Guardar como sugestão para o futuro<div class="help">Use para filmes, séries ou livros que alguém indicou ou que você encontrou e quer lembrar depois.</div></span></label>
        <label id="suggestionSourceField">Quem indicou / onde você encontrou<input id="suggestionSourceInput" placeholder="Ex.: ChatGPT, Carol, Instagram..." /></label>

        <label id="genreField">Gênero<select id="genreInput"><option value="">Selecionar gênero</option><option>Ação</option><option>Aventura</option><option>Animação</option><option>Biografia</option><option>Comédia</option><option>Crime</option><option>Documentário</option><option>Documentário True Crime</option><option>Drama</option><option>Fantasia</option><option>Ficção Científica</option><option>Investigação Criminal</option><option>Musical</option><option>Romance</option><option>Suspense</option><option>Thriller</option><option>True Crime</option><option>Terror</option><option>Outro</option></select></label>

        <div class="row" id="seriesProgressField">
          <label>Temporada<input id="seasonInput" type="number" inputmode="numeric" min="1" step="1" placeholder="Ex.: 2" /></label>
          <label>Episódio em que parou<input id="episodeInput" type="number" inputmode="numeric" min="1" step="1" placeholder="Ex.: 5" /></label>
        </div>

        <label>Link da capa / pôster<input id="imageUrlInput" type="url" inputmode="url" placeholder="Cole aqui o link direto da imagem" /><span class="help">Pode ser uma imagem encontrada no Google, desde que seja o endereço direto da imagem. Links que terminam em .jpg, .jpeg, .png ou .webp costumam funcionar melhor.</span></label>
        <div class="image-preview" id="imagePreview"><img id="imagePreviewImg" alt="Prévia da capa" /><span id="imagePreviewText">Prévia da capa</span></div>

        <label>Nota<select id="ratingInput"><option value="">Sem nota</option><option value="1">1 ★</option><option value="2">2 ★★</option><option value="3">3 ★★★</option><option value="4">4 ★★★★</option><option value="5">5 ★★★★★</option></select></label>
        <label>Observações<textarea id="notesInput" placeholder="Ex.: gostei muito do final, indicação da Carol..."></textarea></label>
      </div>
      <div class="modal-actions"><button type="button" class="secondary" id="cancelBtn">Cancelar</button><button type="submit" class="primary">Salvar</button></div>
    </form>
  </dialog>

<script>
const STORAGE_KEY="minha-estante-v1";
const AUTO_BACKUP_KEY="minha-estante-autobackup-v1";
const rawExistingData=localStorage.getItem(STORAGE_KEY);
if(rawExistingData && !localStorage.getItem(AUTO_BACKUP_KEY)) localStorage.setItem(AUTO_BACKUP_KEY,rawExistingData);
let items=[];
try{items=JSON.parse(rawExistingData||"[]");if(!Array.isArray(items))items=[]}catch{items=[]}
let editingId=null,activeType="Todos",activeStatus="Todos",suggestionsOnly=false;

const list=document.getElementById("list"),dialog=document.getElementById("dialog"),form=document.getElementById("itemForm"),titleInput=document.getElementById("titleInput"),typeInput=document.getElementById("typeInput"),statusInput=document.getElementById("statusInput"),genreInput=document.getElementById("genreInput"),genreField=document.getElementById("genreField"),seasonInput=document.getElementById("seasonInput"),episodeInput=document.getElementById("episodeInput"),seriesProgressField=document.getElementById("seriesProgressField"),ratingInput=document.getElementById("ratingInput"),notesInput=document.getElementById("notesInput"),searchInput=document.getElementById("search"),searchCount=document.getElementById("searchCount"),suggestionInput=document.getElementById("suggestionInput"),suggestionSourceInput=document.getElementById("suggestionSourceInput"),suggestionSourceField=document.getElementById("suggestionSourceField"),imageUrlInput=document.getElementById("imageUrlInput"),imagePreview=document.getElementById("imagePreview"),imagePreviewImg=document.getElementById("imagePreviewImg"),imagePreviewText=document.getElementById("imagePreviewText"),suggestionFilter=document.getElementById("suggestionFilter");

function save(){
  const current=localStorage.getItem(STORAGE_KEY);
  if(current) localStorage.setItem(AUTO_BACKUP_KEY,current);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(items));
  render();
}
function updateConditionalFields(){
  const isMovie=typeInput.value==="Filme",isSeries=typeInput.value==="Série";
  genreField.style.display=isMovie?"grid":"none";
  seriesProgressField.style.display=isSeries?"grid":"none";
  suggestionSourceField.style.display=suggestionInput.checked?"grid":"none";
  if(!isMovie)genreInput.value="";
  if(!isSeries){seasonInput.value="";episodeInput.value=""}
}
function safeUrl(value){
  try{const u=new URL((value||"").trim());return (u.protocol==="http:"||u.protocol==="https:")?u.href:""}catch{return""}
}
function updateImagePreview(){
  const url=safeUrl(imageUrlInput.value);
  if(!url){imagePreview.style.display="none";imagePreviewImg.removeAttribute("src");return}
  imagePreview.style.display="flex";imagePreviewText.textContent="Carregando prévia...";imagePreviewImg.src=url;imagePreviewImg.onload=()=>imagePreviewText.textContent="A capa será exibida no card.";imagePreviewImg.onerror=()=>{imagePreviewText.textContent="Esse link não permitiu carregar a imagem. Tente copiar o endereço direto da imagem."}
}
function openModal(item=null){
  editingId=item?.id||null;document.getElementById("modalTitle").textContent=item?"Editar item":"Adicionar item";
  titleInput.value=item?.title||"";typeInput.value=item?.type||"Filme";statusInput.value=item?.status||"Quero ver/ler";genreInput.value=item?.genre||"";seasonInput.value=item?.season||"";episodeInput.value=item?.episode||"";suggestionInput.checked=Boolean(item?.suggestion);suggestionSourceInput.value=item?.suggestionSource||"";imageUrlInput.value=item?.imageUrl||"";ratingInput.value=item?.rating||"";notesInput.value=item?.notes||"";
  updateConditionalFields();updateImagePreview();dialog.showModal();setTimeout(()=>titleInput.focus(),80)
}
function stars(r){if(!r)return"";return"★".repeat(Number(r))+"☆".repeat(5-Number(r))}
function typeIcon(t){return t==="Filme"?"🎬":t==="Série"?"📺":"📚"}
function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function seriesProgress(item){if(item.type!=="Série"||(!item.season&&!item.episode))return"";const parts=[];if(item.season)parts.push(`T${escapeHtml(item.season)}`);if(item.episode)parts.push(`E${escapeHtml(item.episode)}`);return `<span class="tag">▶ ${parts.join(" • ")}</span>`}
function posterHtml(item){const url=safeUrl(item.imageUrl);if(!url)return"";return `<div class="poster-wrap"><img class="poster" src="${escapeHtml(url)}" alt="Capa de ${escapeHtml(item.title)}" referrerpolicy="no-referrer" onerror="this.parentElement.style.display='none'"></div>`}
function searchableText(item){return [item.title,item.type,item.status,item.genre,item.notes,item.season,item.episode,item.suggestionSource,item.suggestion?"sugestão":""].filter(Boolean).join(" ").toLowerCase()}
function render(){
  const term=searchInput.value.trim().toLowerCase();
  const filtered=items.filter(i=>activeType==="Todos"||i.type===activeType).filter(i=>activeStatus==="Todos"||i.status===activeStatus).filter(i=>!suggestionsOnly||Boolean(i.suggestion)).filter(i=>!term||searchableText(i).includes(term)).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  document.getElementById("totalCount").textContent=items.length;document.getElementById("doneCount").textContent=items.filter(i=>i.status==="Concluído").length;document.getElementById("wantCount").textContent=items.filter(i=>i.status==="Quero ver/ler").length;
  if(term){searchCount.style.display="block";searchCount.textContent=`${filtered.length} resultado${filtered.length===1?"":"s"} encontrado${filtered.length===1?"":"s"}`;}else searchCount.style.display="none";
  if(!filtered.length){list.innerHTML=`<div class="empty">${term?"Nenhum resultado encontrado.":"Nada por aqui ainda.<br>Adicione um filme, série ou livro."}</div>`;return}
  list.innerHTML=filtered.map(item=>`<article class="card"><div class="card-layout">${posterHtml(item)}<div><div class="card-top"><div><h3 class="title">${escapeHtml(item.title)}</h3><div class="meta"><span class="tag">${typeIcon(item.type)} ${item.type}</span>${item.genre?`<span class="tag">🎭 ${escapeHtml(item.genre)}</span>`:""}${seriesProgress(item)}${item.suggestion?`<span class="tag tag-suggest">💡 Sugestão</span>`:""}<span class="tag">${escapeHtml(item.status)}</span></div></div></div>${item.rating?`<div class="rating">${stars(item.rating)} <span style="color:#77736c">(${escapeHtml(item.rating)}/5)</span></div>`:""}${item.suggestion&&item.suggestionSource?`<p class="suggest-source">Indicação: ${escapeHtml(item.suggestionSource)}</p>`:""}${item.notes?`<p class="notes">${escapeHtml(item.notes)}</p>`:""}<div class="actions"><button class="ghost" onclick="editItem('${item.id}')">Editar</button><button class="danger" onclick="deleteItem('${item.id}')">Excluir</button></div></div></div></article>`).join("")
}
window.editItem=id=>{const item=items.find(i=>i.id===id);if(item)openModal(item)};
window.deleteItem=id=>{const item=items.find(i=>i.id===id);if(item&&confirm(`Excluir "${item.title}"?`)){items=items.filter(i=>i.id!==id);save()}};
form.addEventListener("submit",e=>{
  e.preventDefault();const existing=editingId?items.find(i=>i.id===editingId)||{}:{};
  const payload={...existing,id:editingId||crypto.randomUUID(),title:titleInput.value.trim(),type:typeInput.value,status:statusInput.value,genre:typeInput.value==="Filme"?genreInput.value:"",season:typeInput.value==="Série"?seasonInput.value:"",episode:typeInput.value==="Série"?episodeInput.value:"",suggestion:suggestionInput.checked,suggestionSource:suggestionInput.checked?suggestionSourceInput.value.trim():"",imageUrl:safeUrl(imageUrlInput.value),rating:ratingInput.value,notes:notesInput.value.trim(),updatedAt:Date.now()};
  if(!payload.title)return;if(editingId){const idx=items.findIndex(i=>i.id===editingId);items[idx]=payload}else items.push(payload);save();dialog.close();form.reset();editingId=null
});

document.getElementById("cancelBtn").addEventListener("click",()=>dialog.close());typeInput.addEventListener("change",updateConditionalFields);suggestionInput.addEventListener("change",updateConditionalFields);imageUrlInput.addEventListener("input",()=>{clearTimeout(window.__imgTimer);window.__imgTimer=setTimeout(updateImagePreview,450)});document.getElementById("addBtn").addEventListener("click",()=>openModal());document.getElementById("fab").addEventListener("click",()=>openModal());searchInput.addEventListener("input",render);
document.querySelectorAll("#typeFilters .chip[data-type]").forEach(btn=>btn.addEventListener("click",()=>{activeType=btn.dataset.type;document.querySelectorAll("#typeFilters .chip[data-type]").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render()}));
document.querySelectorAll("#statusFilters .chip").forEach(btn=>btn.addEventListener("click",()=>{activeStatus=btn.dataset.status;document.querySelectorAll("#statusFilters .chip").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render()}));
suggestionFilter.addEventListener("click",()=>{suggestionsOnly=!suggestionsOnly;suggestionFilter.classList.toggle("active",suggestionsOnly);render()});

document.getElementById("exportBtn").addEventListener("click",()=>{const blob=new Blob([JSON.stringify(items,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="minha-estante-backup.json";a.click();URL.revokeObjectURL(url)});
document.getElementById("importInput").addEventListener("change",async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed))throw new Error();const current=localStorage.getItem(STORAGE_KEY);if(current)localStorage.setItem(AUTO_BACKUP_KEY,current);items=parsed;localStorage.setItem(STORAGE_KEY,JSON.stringify(items));render();alert("Backup importado com sucesso.")}catch{alert("Não foi possível importar esse arquivo.")}e.target.value=""});
document.getElementById("restoreAutoBackupBtn").addEventListener("click",()=>{const backup=localStorage.getItem(AUTO_BACKUP_KEY);if(!backup){alert("Ainda não existe um backup automático neste aparelho.");return}if(!confirm("Restaurar o backup automático? O estado atual será substituído pela cópia anterior."))return;try{const parsed=JSON.parse(backup);if(!Array.isArray(parsed))throw new Error();items=parsed;localStorage.setItem(STORAGE_KEY,backup);render();alert("Backup automático restaurado.")}catch{alert("Não foi possível restaurar o backup automático.")}});

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));updateConditionalFields();render();
</script>
</body>
</html>
