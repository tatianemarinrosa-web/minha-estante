<!DOCTYPE html>

<title>Minha Estante</title>
<style>
:root{--bg:#f7f4ee;--surface:#fff;--text:#171717;--muted:#77736c;--border:#e7e0d6;--soft:#eee7dc;--accent:#171717;--danger:#a83f35;--warn:#8a651e;--radius:20px;--shadow:0 12px 30px rgba(0,0,0,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.app{width:min(100%,840px);margin:auto;padding:22px 12px calc(105px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}h1{margin:0;font-size:clamp(30px,7vw,44px);letter-spacing:-1.6px}.subtitle{margin:6px 0 0;color:var(--muted);font-size:14px}.version{font-size:11px;color:var(--muted);margin-top:5px}.primary{border:0;background:var(--accent);color:#fff;padding:12px 15px;border-radius:14px;font-weight:750;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0}.stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:11px}.stat strong{display:block;font-size:19px}.stat span{font-size:12px;color:var(--muted)}.toolbar{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 90%,rgba(247,244,238,0));padding:8px 0 15px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:5px;gap:5px;margin-bottom:10px}.tab{border:0;background:transparent;padding:10px 5px;border-radius:12px;font-weight:750;cursor:pointer;font-size:13px}.tab.active{background:var(--accent);color:#fff}.search-wrap{position:relative}.glass{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none}.search{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:15px;padding:14px 15px 14px 43px;outline:none}.control-row{display:grid;grid-template-columns:1fr;gap:8px;margin-top:9px}.sort{border:1px solid var(--border);background:var(--surface);border-radius:13px;padding:10px 12px;width:100%}.filters{display:flex;gap:8px;overflow-x:auto;padding:9px 0 0;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{border:1px solid var(--border);background:var(--surface);padding:8px 11px;border-radius:999px;white-space:nowrap;font-size:12px;cursor:pointer}.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}.section-title{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}.section-title h2{margin:0;font-size:22px}.section-title span{font-size:12px;color:var(--muted)}.list{display:grid;gap:12px}.card{display:grid;grid-template-columns:auto 1fr;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px;box-shadow:var(--shadow);gap:11px}.poster,.placeholder{width:88px;height:132px;border-radius:14px;background:var(--soft);border:1px solid var(--border)}.poster{object-fit:cover;display:block}.placeholder{display:flex;align-items:center;justify-content:center;font-size:30px}.content{min-width:0}.title{margin:1px 0 0;font-size:17px;line-height:1.25;font-weight:800}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.tag{background:var(--soft);padding:6px 9px;border-radius:999px;font-size:12px;color:#504a43}.tag.suggestion{background:#fff0c9}.rating{font-size:14px;margin-top:10px;letter-spacing:1px}.notes{margin:9px 0 0;color:var(--muted);font-size:14px;line-height:1.45;white-space:pre-wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.ghost,.danger{border:1px solid var(--border);background:transparent;border-radius:12px;padding:8px 10px;cursor:pointer;font-size:13px}.danger{color:var(--danger)}.empty{text-align:center;padding:58px 20px;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius)}.backup{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.backup button,.backup label{border:1px solid var(--border);background:var(--surface);padding:9px 12px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:650}.backup input{display:none}.install-button{width:100%;margin-top:18px;border:0;background:var(--accent);color:#fff;padding:12px 14px;border-radius:13px;cursor:pointer;font-size:13px;font-weight:750;display:none}.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:28px;box-shadow:0 12px 28px rgba(0,0,0,.2);cursor:pointer;display:block}dialog{width:min(94vw,560px);max-height:92vh;border:0;border-radius:24px;padding:0;box-shadow:0 22px 70px rgba(0,0,0,.24)}dialog::backdrop{background:rgba(0,0,0,.45)}.modal{padding:20px;background:var(--surface);overflow:auto;max-height:92vh}.modal h2{margin:0 0 16px;font-size:24px}.grid{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr;gap:10px}label{font-size:13px;font-weight:700;display:grid;gap:6px}input,select,textarea{width:100%;border:1px solid var(--border);background:#fff;border-radius:13px;padding:12px 13px;outline:none;color:var(--text)}textarea{resize:vertical;min-height:84px}.hint{font-size:11px;color:var(--muted);line-height:1.45;font-weight:500}.image-preview{display:none;align-items:center;gap:12px;border:1px dashed var(--border);border-radius:14px;padding:10px}.image-preview img{width:70px;height:105px;object-fit:cover;border-radius:9px;background:var(--soft)}.preview-ok{color:#317148}.preview-error{color:var(--warn)}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.secondary{border:1px solid var(--border);background:transparent;padding:11px 14px;border-radius:13px;cursor:pointer}@media(min-width:581px){.app{padding-left:16px;padding-right:16px}.row{grid-template-columns:1fr 1fr}.control-row{grid-template-columns:1fr auto}.sort{min-width:210px}.fab{display:none}header .primary{display:block}}
</style>
</head>
<body>
<main class="app">
<header><div><h1>Minha Estante</h1><p class="subtitle">Sua coleção de séries, filmes e livros.</p><div class="version">versão 10 • mobile</div></div><button class="primary" id="addBtn">+ Adicionar</button></header>
<section class="stats"><div class="stat"><strong id="totalCount">0</strong><span>Total</span></div><div class="stat"><strong id="doneCount">0</strong><span>Concluídos</span></div><div class="stat"><strong id="futureCount">0</strong><span>Para o futuro</span></div></section>
<section class="toolbar">
<div class="tabs"><button class="tab active" data-type="Série">📺 Séries</button><button class="tab" data-type="Filme">🎬 Filmes</button><button class="tab" data-type="Livro">📚 Livros</button></div>
<div class="search-wrap"><span class="glass">🔎</span><input id="search" class="search" placeholder="Buscar nesta aba..."></div>
<div class="control-row"><div class="filters" id="statusFilters"><button class="chip active" data-status="Todos">Todos</button><button class="chip" data-status="Quero ver/ler">Quero ver/ler</button><button class="chip" data-status="Em andamento">Em andamento</button><button class="chip" data-status="Concluído">Concluído</button><button class="chip" data-status="Sugestão futura">💡 Sugestões</button></div><select id="sortSelect" class="sort"><option value="date-desc">Data: mais recentes</option><option value="date-asc">Data: mais antigos</option><option value="az">A–Z</option><option value="za">Z–A</option></select></div>
</section>
<div class="section-title"><h2 id="sectionTitle">Séries</h2><span id="resultCount"></span></div>
<section id="list" class="list"></section>
<button id="installBtn" class="install-button" type="button">Instalar Minha Estante no celular</button>
<div class="backup"><button id="exportBtn">Exportar backup</button><label>Importar backup<input id="importInput" type="file" accept=".json,application/json"></label></div>
</main>
<button class="fab" id="fab" aria-label="Adicionar item">+</button>
<dialog id="dialog"><form method="dialog" class="modal" id="itemForm"><h2 id="modalTitle">Adicionar item</h2><div class="grid">
<label>Título<input id="titleInput" required placeholder="Ex.: Black Bird"></label>
<div class="row"><label>Tipo<select id="typeInput"><option>Série</option><option>Mini Série</option><option>Filme</option><option>Livro</option></select></label><label>Status<select id="statusInput"><option>Quero ver/ler</option><option>Em andamento</option><option>Concluído</option><option>Sugestão futura</option></select></label></div>
<label>Gênero<input id="genreInput" list="genreOptions" placeholder="Ex.: Suspense policial/investigativo"><datalist id="genreOptions"><option value="Ação"><option value="Aventura"><option value="Animação"><option value="Biografia"><option value="Comédia"><option value="Crime"><option value="Documentário"><option value="Documentário true crime"><option value="Drama"><option value="Drama Policial"><option value="Fantasia"><option value="Ficção"><option value="Ficção Científica"><option value="Investigação Criminal"><option value="Mistério"><option value="Musical"><option value="Policial"><option value="Romance"><option value="Suspense"><option value="Suspense policial/investigativo"><option value="Thriller"><option value="True Crime"><option value="Terror"><option value="Não ficção"><option value="História"><option value="Autoajuda"><option value="Desenvolvimento pessoal"><option value="Religioso / Espiritualidade"><option value="Literatura"><option value="Poesia"><option value="Infantil"><option value="Young Adult"><option value="HQ / Graphic Novel"><option value="Saúde"><option value="Negócios"></datalist><span class="hint">Você pode escolher uma sugestão ou digitar qualquer gênero.</span></label>
<div class="row" id="seriesProgressField"><label>Temporada em que parou<input id="seasonInput" type="number" inputmode="numeric" min="1" step="1" placeholder="Ex.: 1"></label><label>Episódio em que parou<input id="episodeInput" type="number" inputmode="numeric" min="1" step="1" placeholder="Ex.: 5"></label></div>
<label>Link da capa / pôster<input id="imageUrlInput" type="text" inputmode="url" placeholder="Cole aqui o endereço da imagem"><span class="hint">No Google Imagens, abra a imagem primeiro e copie o endereço da imagem — não o link da página de pesquisa. A prévia abaixo confirma se o endereço funciona.</span></label>
<div class="image-preview" id="imagePreview"><img id="imagePreviewImg" alt="Prévia da capa" referrerpolicy="no-referrer"><span class="hint" id="imagePreviewText">Prévia da capa</span></div>
<label>Quem indicou / origem da sugestão<input id="suggestionSourceInput" placeholder="Ex.: indicação de alguém, Instagram..."></label>
<label>Nota<select id="ratingInput"><option value="">Sem nota</option><option value="1">1 ★</option><option value="2">2 ★★</option><option value="3">3 ★★★</option><option value="4">4 ★★★★</option><option value="5">5 ★★★★★</option></select></label>
<label>Observações<textarea id="notesInput" placeholder="Anote o que quiser lembrar..."></textarea></label>
</div><div class="modal-actions"><button type="button" class="secondary" id="cancelBtn">Cancelar</button><button type="submit" class="primary">Salvar</button></div></form></dialog>
<script>
const STORAGE_KEY="minha-estante-v1",SAFETY_KEY="minha-estante-safety-backup-v10";let items=[];try{items=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");if(!Array.isArray(items))items=[]}catch{items=[]}if(localStorage.getItem(STORAGE_KEY)&&!localStorage.getItem(SAFETY_KEY))localStorage.setItem(SAFETY_KEY,localStorage.getItem(STORAGE_KEY));let editingId=null,activeType="Série",activeStatus="Todos",sortMode="date-desc",deferredInstallPrompt=null;const $=id=>document.getElementById(id),list=$("list"),dialog=$("dialog"),form=$("itemForm"),titleInput=$("titleInput"),typeInput=$("typeInput"),statusInput=$("statusInput"),genreInput=$("genreInput"),seriesProgressField=$("seriesProgressField"),seasonInput=$("seasonInput"),episodeInput=$("episodeInput"),imageUrlInput=$("imageUrlInput"),imagePreview=$("imagePreview"),imagePreviewImg=$("imagePreviewImg"),imagePreviewText=$("imagePreviewText"),suggestionSourceInput=$("suggestionSourceInput"),ratingInput=$("ratingInput"),notesInput=$("notesInput"),searchInput=$("search");
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(items));render()}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function normalizeImageUrl(v){let u=String(v||"").trim().replaceAll("&amp;","&");if(!u)return"";try{let rawMatch=u.match(/[?&](?:imgurl|mediaurl)=([^&]+)/i);if(rawMatch){let candidate=decodeURIComponent(rawMatch[1]);if(/^https?:\/\//i.test(candidate))u=candidate}let parsed=new URL(u);let candidate=parsed.searchParams.get("imgurl")||parsed.searchParams.get("mediaurl");if(candidate&&/^https?:\/\//i.test(candidate))u=decodeURIComponent(candidate)}catch{}return /^https?:\/\//i.test(u)?u:""}
function isSeriesType(t){return t==="Série"||t==="Mini Série"}
function belongsToTab(item,tab){return tab==="Série"?isSeriesType(item.type):item.type===tab}
function icon(t){return isSeriesType(t)?"📺":t==="Filme"?"🎬":"📚"}
function stars(r){if(!r)return"";let n=Number(r);return"★".repeat(n)+"☆".repeat(5-n)}
function updateFields(){let series=isSeriesType(typeInput.value);seriesProgressField.style.display=series?"grid":"none";if(!series){seasonInput.value="";episodeInput.value=""}}
function preview(){let u=normalizeImageUrl(imageUrlInput.value);imagePreviewText.className="hint";if(!u){imagePreview.style.display="none";imagePreviewImg.removeAttribute("src");return}imagePreview.style.display="flex";imagePreviewText.textContent="Testando a capa...";imagePreviewImg.referrerPolicy="no-referrer";imagePreviewImg.onload=()=>{imagePreviewText.textContent="✓ Capa carregada corretamente";imagePreviewText.className="hint preview-ok"};imagePreviewImg.onerror=()=>{imagePreviewText.textContent="Esse link não é uma imagem exibível. No Google Imagens, abra a foto e copie o endereço da imagem.";imagePreviewText.className="hint preview-error"};imagePreviewImg.src=u}
function openModal(item=null){editingId=item?.id||null;$("modalTitle").textContent=item?"Editar item":"Adicionar item";titleInput.value=item?.title||"";typeInput.value=item?.type||(activeType==="Série"?"Série":activeType);statusInput.value=item?.status||"Quero ver/ler";genreInput.value=item?.genre||"";seasonInput.value=item?.season||"";episodeInput.value=item?.episode||"";imageUrlInput.value=item?.imageUrl||"";suggestionSourceInput.value=item?.suggestionSource||"";ratingInput.value=item?.rating||"";notesInput.value=item?.notes||"";updateFields();preview();dialog.showModal();setTimeout(()=>titleInput.focus(),50)}
function progress(i){if(!isSeriesType(i.type)||(!i.season&&!i.episode))return"";let p=[];if(i.season)p.push("T"+esc(i.season));if(i.episode)p.push("E"+esc(i.episode));return`<span class="tag">▶ ${p.join(" • ")}</span>`}
function poster(i){let u=normalizeImageUrl(i.imageUrl);return u?`<img class="poster" src="${esc(u)}" alt="Capa de ${esc(i.title)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="placeholder" style="display:none">${icon(i.type)}</div>`:`<div class="placeholder">${icon(i.type)}</div>`}
function sortItems(arr){return arr.sort((a,b)=>{if(sortMode==="az")return String(a.title||"").localeCompare(String(b.title||""),"pt-BR",{sensitivity:"base"});if(sortMode==="za")return String(b.title||"").localeCompare(String(a.title||""),"pt-BR",{sensitivity:"base"});let da=Number(a.createdAt||a.updatedAt||0),db=Number(b.createdAt||b.updatedAt||0);return sortMode==="date-asc"?da-db:db-da})}
function render(){let term=searchInput.value.trim().toLowerCase();let filtered=items.filter(i=>belongsToTab(i,activeType)).filter(i=>activeStatus==="Todos"||i.status===activeStatus).filter(i=>!term||[i.title,i.type,i.genre,i.notes,i.suggestionSource].some(v=>String(v||"").toLowerCase().includes(term)));sortItems(filtered);$("totalCount").textContent=items.length;$("doneCount").textContent=items.filter(i=>i.status==="Concluído").length;$("futureCount").textContent=items.filter(i=>i.status==="Sugestão futura"||i.status==="Quero ver/ler").length;$("sectionTitle").textContent=activeType==="Série"?"Séries + Mini Séries":activeType==="Filme"?"Filmes":"Livros";$("resultCount").textContent=filtered.length+" item"+(filtered.length===1?"":"s");if(!filtered.length){list.innerHTML='<div class="empty">Nenhum item nesta aba com os filtros atuais.</div>';return}list.innerHTML=filtered.map(i=>`<article class="card">${poster(i)}<div class="content"><h3 class="title">${esc(i.title)}</h3><div class="meta"><span class="tag">${icon(i.type)} ${esc(i.type)}</span>${i.genre?`<span class="tag">🎭 ${esc(i.genre)}</span>`:""}${progress(i)}<span class="tag ${i.status==="Sugestão futura"?"suggestion":""}">${i.status==="Sugestão futura"?"💡 ":""}${esc(i.status)}</span></div>${i.suggestionSource?`<p class="notes"><strong>Indicação:</strong> ${esc(i.suggestionSource)}</p>`:""}${i.rating?`<div class="rating">${stars(i.rating)} <span style="color:#77736c">(${i.rating}/5)</span></div>`:""}${i.notes?`<p class="notes">${esc(i.notes)}</p>`:""}<div class="actions"><button class="ghost" onclick="editItem('${i.id}')">Editar</button><button class="danger" onclick="deleteItem('${i.id}')">Excluir</button></div></div></article>`).join("")}
window.editItem=id=>{let i=items.find(x=>x.id===id);if(i)openModal(i)};window.deleteItem=id=>{let i=items.find(x=>x.id===id);if(i&&confirm(`Excluir "${i.title}"?`)){items=items.filter(x=>x.id!==id);save()}};
form.addEventListener("submit",e=>{e.preventDefault();let existing=editingId?items.find(i=>i.id===editingId)||{}:{},now=Date.now(),series=isSeriesType(typeInput.value),payload={...existing,id:editingId||crypto.randomUUID(),title:titleInput.value.trim(),type:typeInput.value,status:statusInput.value,genre:genreInput.value.trim(),season:series?seasonInput.value:"",episode:series?episodeInput.value:"",imageUrl:normalizeImageUrl(imageUrlInput.value),suggestionSource:suggestionSourceInput.value.trim(),rating:ratingInput.value,notes:notesInput.value.trim(),createdAt:existing.createdAt||existing.updatedAt||now,updatedAt:now};if(!payload.title)return;if(editingId){let idx=items.findIndex(i=>i.id===editingId);items[idx]=payload}else items.push(payload);activeType=isSeriesType(payload.type)?"Série":payload.type;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.type===activeType));save();dialog.close();form.reset();editingId=null});
$("cancelBtn").addEventListener("click",()=>dialog.close());typeInput.addEventListener("change",updateFields);imageUrlInput.addEventListener("input",preview);$("addBtn").addEventListener("click",()=>openModal());$("fab").addEventListener("click",()=>openModal());searchInput.addEventListener("input",render);$("sortSelect").addEventListener("change",e=>{sortMode=e.target.value;render()});document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{activeType=btn.dataset.type;document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));btn.classList.add("active");searchInput.value="";render()}));document.querySelectorAll("#statusFilters .chip").forEach(btn=>btn.addEventListener("click",()=>{activeStatus=btn.dataset.status;document.querySelectorAll("#statusFilters .chip").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render()}));
$("exportBtn").addEventListener("click",()=>{let blob=new Blob([JSON.stringify(items,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="minha-estante-backup.json";a.click();URL.revokeObjectURL(url)});$("importInput").addEventListener("change",async e=>{let file=e.target.files[0];if(!file)return;try{let parsed=JSON.parse(await file.text());if(!Array.isArray(parsed))throw new Error();items=parsed;save();alert("Backup importado com sucesso.")}catch{alert("Não foi possível importar esse arquivo.")}e.target.value=""});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;$("installBtn").style.display="block"});$("installBtn").addEventListener("click",async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;$("installBtn").style.display="none"});window.addEventListener("appinstalled",()=>{$("installBtn").style.display="none";deferredInstallPrompt=null});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));updateFields();render();
</script>
</body>
</html>
