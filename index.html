<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="description" content="Organize filmes, séries e livros que você quer ver, está consumindo ou já terminou." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Minha Estante</title>
  <style>
    :root {
      --bg: #f7f4ee;
      --surface: #ffffff;
      --text: #161616;
      --muted: #77736c;
      --border: #e7e0d6;
      --accent: #1b1b1b;
      --soft: #eee7dc;
      --danger: #a83f35;
      --radius: 20px;
      --shadow: 0 12px 30px rgba(0,0,0,.06);
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    button,input,select,textarea{font:inherit}.app{width:min(100%,760px);margin:0 auto;padding:22px 16px 100px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}h1{margin:0;font-size:clamp(28px,7vw,42px);letter-spacing:-1.5px}.subtitle{color:var(--muted);margin:6px 0 0;font-size:14px;line-height:1.4}.primary{border:0;background:var(--accent);color:#fff;padding:12px 15px;border-radius:14px;cursor:pointer;font-weight:700;min-width:max-content}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px}.stat strong{display:block;font-size:22px;margin-bottom:3px}.stat span{font-size:12px;color:var(--muted)}.toolbar{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,rgba(247,244,238,0));padding:10px 0 14px}.search{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:15px;padding:14px 15px;outline:none}.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 12px;border-radius:999px;white-space:nowrap;cursor:pointer;font-size:13px}.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}.list{display:grid;gap:12px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}.card-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.title{margin:0;font-size:18px;font-weight:800;line-height:1.25}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.tag{background:var(--soft);padding:6px 9px;border-radius:999px;font-size:12px;color:#504a43}.rating{font-size:14px;margin-top:10px;letter-spacing:1px}.notes{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.45;white-space:pre-wrap}.actions{display:flex;gap:8px;margin-top:14px}.ghost,.danger{border:1px solid var(--border);background:transparent;border-radius:12px;padding:9px 11px;cursor:pointer;font-size:13px}.danger{color:var(--danger)}.empty{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius)}.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:28px;box-shadow:0 12px 28px rgba(0,0,0,.2);cursor:pointer;display:none}dialog{width:min(92vw,520px);border:0;border-radius:24px;padding:0;box-shadow:0 22px 70px rgba(0,0,0,.24)}dialog::backdrop{background:rgba(0,0,0,.45)}.modal{padding:20px;background:var(--surface)}.modal h2{margin:0 0 16px;font-size:24px;letter-spacing:-.7px}.grid{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;font-weight:700;display:grid;gap:6px}input,select,textarea{width:100%;border:1px solid var(--border);background:#fff;border-radius:13px;padding:12px 13px;outline:none;color:var(--text)}textarea{resize:vertical;min-height:90px}.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}.secondary{border:1px solid var(--border);background:transparent;padding:11px 14px;border-radius:13px;cursor:pointer}.backup{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.backup button,.backup label{border:1px solid var(--border);background:var(--surface);padding:9px 12px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:600}.backup input{display:none}@media(max-width:580px){header .primary{display:none}.fab{display:block}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:19px}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="app">
    <header><div><h1>Minha Estante</h1><p class="subtitle">Filmes, séries e livros. Tudo o que você quer ver, está acompanhando ou já terminou.</p></div><button class="primary" id="addBtn">+ Adicionar</button></header>
    <section class="stats"><div class="stat"><strong id="totalCount">0</strong><span>Total</span></div><div class="stat"><strong id="doneCount">0</strong><span>Concluídos</span></div><div class="stat"><strong id="wantCount">0</strong><span>Quero ver/ler</span></div></section>
    <section class="toolbar">
      <input id="search" class="search" placeholder="Buscar por título..." />
      <div class="filters" id="typeFilters"><button class="chip active" data-type="Todos">Todos</button><button class="chip" data-type="Filme">🎬 Filmes</button><button class="chip" data-type="Série">📺 Séries</button><button class="chip" data-type="Livro">📚 Livros</button></div>
      <div class="filters" id="statusFilters"><button class="chip active" data-status="Todos">Todos os status</button><button class="chip" data-status="Quero ver/ler">Quero ver/ler</button><button class="chip" data-status="Em andamento">Em andamento</button><button class="chip" data-status="Concluído">Concluído</button></div>
    </section>
    <section id="list" class="list"></section>
    <div class="backup"><button id="exportBtn">Exportar backup</button><label>Importar backup<input id="importInput" type="file" accept=".json,application/json" /></label></div>
  </main>
  <button class="fab" id="fab" aria-label="Adicionar item">+</button>
  <dialog id="dialog"><form method="dialog" class="modal" id="itemForm"><h2 id="modalTitle">Adicionar item</h2><div class="grid">
    <label>Título<input id="titleInput" required placeholder="Ex.: O Urso" /></label>
    <div class="row"><label>Tipo<select id="typeInput"><option>Filme</option><option>Série</option><option>Livro</option></select></label><label>Status<select id="statusInput"><option>Quero ver/ler</option><option>Em andamento</option><option>Concluído</option></select></label></div>
    <label id="genreField">Gênero<select id="genreInput"><option value="">Selecionar gênero</option><option>Ação</option><option>Aventura</option><option>Animação</option><option>Biografia</option><option>Comédia</option><option>Crime</option><option>Documentário</option><option>Documentário True Crime</option><option>Drama</option><option>Fantasia</option><option>Ficção Científica</option><option>Investigação Criminal</option><option>Musical</option><option>Romance</option><option>Suspense</option><option>Thriller</option><option>True Crime</option><option>Terror</option><option>Outro</option></select></label>
    <label>Nota<select id="ratingInput"><option value="">Sem nota</option><option value="1">1 ★</option><option value="2">2 ★★</option><option value="3">3 ★★★</option><option value="4">4 ★★★★</option><option value="5">5 ★★★★★</option></select></label>
    <label>Observações<textarea id="notesInput" placeholder="Ex.: gostei muito do final, indicação da Carol..."></textarea></label>
  </div><div class="modal-actions"><button type="button" class="secondary" id="cancelBtn">Cancelar</button><button type="submit" class="primary">Salvar</button></div></form></dialog>
<script>
const STORAGE_KEY="minha-estante-v1";let items=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"),editingId=null,activeType="Todos",activeStatus="Todos";const list=document.getElementById("list"),dialog=document.getElementById("dialog"),form=document.getElementById("itemForm"),titleInput=document.getElementById("titleInput"),typeInput=document.getElementById("typeInput"),statusInput=document.getElementById("statusInput"),genreInput=document.getElementById("genreInput"),genreField=document.getElementById("genreField"),ratingInput=document.getElementById("ratingInput"),notesInput=document.getElementById("notesInput"),searchInput=document.getElementById("search");function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(items));render()}function updateGenreVisibility(){const isMovie=typeInput.value==="Filme";genreField.style.display=isMovie?"grid":"none";if(!isMovie)genreInput.value=""}function openModal(item=null){editingId=item?.id||null;document.getElementById("modalTitle").textContent=item?"Editar item":"Adicionar item";titleInput.value=item?.title||"";typeInput.value=item?.type||"Filme";statusInput.value=item?.status||"Quero ver/ler";genreInput.value=item?.genre||"";updateGenreVisibility();ratingInput.value=item?.rating||"";notesInput.value=item?.notes||"";dialog.showModal();setTimeout(()=>titleInput.focus(),80)}function stars(r){if(!r)return"";return"★".repeat(Number(r))+"☆".repeat(5-Number(r))}function typeIcon(t){return t==="Filme"?"🎬":t==="Série"?"📺":"📚"}function escapeHtml(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function render(){const term=searchInput.value.trim().toLowerCase();const filtered=items.filter(i=>activeType==="Todos"||i.type===activeType).filter(i=>activeStatus==="Todos"||i.status===activeStatus).filter(i=>!term||i.title.toLowerCase().includes(term)).sort((a,b)=>b.updatedAt-a.updatedAt);document.getElementById("totalCount").textContent=items.length;document.getElementById("doneCount").textContent=items.filter(i=>i.status==="Concluído").length;document.getElementById("wantCount").textContent=items.filter(i=>i.status==="Quero ver/ler").length;if(!filtered.length){list.innerHTML='<div class="empty">Nada por aqui ainda.<br>Adicione um filme, série ou livro.</div>';return}list.innerHTML=filtered.map(item=>`<article class="card"><div class="card-top"><div><h3 class="title">${escapeHtml(item.title)}</h3><div class="meta"><span class="tag">${typeIcon(item.type)} ${item.type}</span>${item.genre?`<span class="tag">🎭 ${escapeHtml(item.genre)}</span>`:""}<span class="tag">${item.status}</span></div></div></div>${item.rating?`<div class="rating">${stars(item.rating)} <span style="color:#77736c">(${item.rating}/5)</span></div>`:""}${item.notes?`<p class="notes">${escapeHtml(item.notes)}</p>`:""}<div class="actions"><button class="ghost" onclick="editItem('${item.id}')">Editar</button><button class="danger" onclick="deleteItem('${item.id}')">Excluir</button></div></article>`).join("")}window.editItem=id=>{const item=items.find(i=>i.id===id);if(item)openModal(item)};window.deleteItem=id=>{const item=items.find(i=>i.id===id);if(item&&confirm(`Excluir "${item.title}"?`)){items=items.filter(i=>i.id!==id);save()}};form.addEventListener("submit",e=>{e.preventDefault();const payload={id:editingId||crypto.randomUUID(),title:titleInput.value.trim(),type:typeInput.value,status:statusInput.value,genre:typeInput.value==="Filme"?genreInput.value:"",rating:ratingInput.value,notes:notesInput.value.trim(),updatedAt:Date.now()};if(!payload.title)return;if(editingId){const idx=items.findIndex(i=>i.id===editingId);items[idx]=payload}else items.push(payload);save();dialog.close();form.reset();editingId=null});document.getElementById("cancelBtn").addEventListener("click",()=>dialog.close());typeInput.addEventListener("change",updateGenreVisibility);document.getElementById("addBtn").addEventListener("click",()=>openModal());document.getElementById("fab").addEventListener("click",()=>openModal());searchInput.addEventListener("input",render);document.querySelectorAll("#typeFilters .chip").forEach(btn=>btn.addEventListener("click",()=>{activeType=btn.dataset.type;document.querySelectorAll("#typeFilters .chip").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render()}));document.querySelectorAll("#statusFilters .chip").forEach(btn=>btn.addEventListener("click",()=>{activeStatus=btn.dataset.status;document.querySelectorAll("#statusFilters .chip").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render()}));document.getElementById("exportBtn").addEventListener("click",()=>{const blob=new Blob([JSON.stringify(items,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="minha-estante-backup.json";a.click();URL.revokeObjectURL(url)});document.getElementById("importInput").addEventListener("change",async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed))throw new Error();items=parsed;save();alert("Backup importado com sucesso.")}catch{alert("Não foi possível importar esse arquivo.")}e.target.value=""});if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));updateGenreVisibility();render();
</script></body></html>
